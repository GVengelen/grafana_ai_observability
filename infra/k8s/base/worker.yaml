apiVersion: apps/v1
kind: Deployment
metadata:
  name: question-worker
  namespace: pokemon-qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: question-worker
  template:
    metadata:
      labels:
        app: question-worker
    spec:
      containers:
        - name: question-worker
          image: pokemon-qa-worker:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: pokemon-qa-config
            - secretRef:
                name: pokemon-qa-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
