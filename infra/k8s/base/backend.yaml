apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: pokemon-qa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: pokemon-qa-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: pokemon-qa-config
            - secretRef:
                name: pokemon-qa-secrets
          startupProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 60
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: pokemon-qa
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
