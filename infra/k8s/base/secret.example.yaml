apiVersion: v1
kind: Secret
metadata:
  name: pokemon-qa-secrets
  namespace: pokemon-qa
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "<YOUR_ANTHROPIC_API_KEY>"
  # Sigil: glc_ token with sigil:write + metrics:write + traces:write + logs:write
  SIGIL_AUTH_TOKEN: "<YOUR_SIGIL_AUTH_TOKEN>"
  # OTel basic-auth header: base64 of "<otlp-instance-id>:<glc_token>"
  # printf '%s' '1260200:<YOUR_OTLP_WRITE_TOKEN>' | base64 | tr -d '\n'
  OTEL_EXPORTER_OTLP_HEADERS: "<YOUR_OTEL_AUTH_HEADER>"
