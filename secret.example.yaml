apiVersion: v1
kind: Secret
metadata:
  name: pokemon-qa-secrets
  namespace: pokemon-qa
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "<YOUR_ANTHROPIC_API_KEY>"
  # OTel basic-auth header: base64 of "<otlp-instance-id>:<glc_token>"
  # printf '%s' '<your-otlp-instance-id>:<YOUR_OTLP_WRITE_TOKEN>' | base64 | tr -d '\n'
  OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Basic%20<bas64-encoded-otlp-auth-header>"
